services:
  # A Docker web service
  - type: web
    name: tiki-reviewer-chatbot
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # Production: avoid --reload to prevent reloader restarts on Render
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT